  <!-- Стрелки поворота куба -->
  <button class="cube-nav prev" id="prevFace">‹</button>
  <button class="cube-nav next" id="nextFace">›</button>

  <footer class="footer">
    <a href="bio.html" class="contact-link">CONTACT</a>
    <p class="copyright">© 2026 Liakhov Roman. All rights reserved.</p>
    <a href="all.html" class="show-all-btn" id="showAllBtn">SHOW ALL</a>
  </footer>

  <script>
    // ===== Поворот куба =====
    const cube = document.getElementById('cube');
    let currentRotation = 0;

    document.getElementById('nextFace').addEventListener('click', () => {
      currentRotation -= 90;
      cube.style.transform = `rotateY(${currentRotation}deg)`;
    });

    document.getElementById('prevFace').addEventListener('click', () => {
      currentRotation += 90;
      cube.style.transform = `rotateY(${currentRotation}deg)`;
    });

    // ===== Анимация плиток (только на передней грани) =====
    document.querySelectorAll('.front .cell').forEach(cell => {
      let isAnimating = false;
      cell.addEventListener('mouseenter', () => {
        if (isAnimating) return;
        isAnimating = true;
        cell.style.transform = 'rotateY(360deg)';
        setTimeout(() => {
          cell.style.transition = 'none';
          cell.style.transform = 'rotateY(0deg)';
          setTimeout(() => {
            cell.style.transition = 'transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1)';
            isAnimating = false;
          }, 20);
        }, 900);
      });
    });

    // ===== SHOW ALL =====
    document.getElementById('showAllBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const cells = document.querySelectorAll('.front .cell');
      
      cells.forEach((cell) => {
        const x = (Math.random() - 0.5) * 1200;
        const y = (Math.random() - 0.5) * 800;
        const rot = (Math.random() - 0.5) * 180;
        cell.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        cell.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(0.3)`;
        cell.style.opacity = '0';
      });

      setTimeout(() => {
        window.location.href = 'all.html';
      }, 850);
    });
  </script>
</body>
