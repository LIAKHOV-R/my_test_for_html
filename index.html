  <script>
    const panels = document.getElementById('panels');
    let currentIndex = 0;
    const totalPanels = 3;

    document.getElementById('nextFace').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % totalPanels;
      panels.style.transform = `translateX(-${currentIndex * 100}%)`;
    });

    document.getElementById('prevFace').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + totalPanels) % totalPanels;
      panels.style.transform = `translateX(-${currentIndex * 100}%)`;
    });

    // Анимация плиток только на первой панели
    document.querySelectorAll('.panel:first-child .cell').forEach(cell => {
      let isAnimating = false;
      cell.addEventListener('mouseenter', () => {
        if (isAnimating) return;
        isAnimating = true;
        cell.style.transform = 'rotateY(360deg)';
        setTimeout(() => {
          cell.style.transition = 'none';
          cell.style.transform = 'rotateY(0deg)';
          setTimeout(() => {
            cell.style.transition = 'transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1)';
            isAnimating = false;
          }, 20);
        }, 900);
      });
    });

    // SHOW ALL
    document.getElementById('showAllBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const cells = document.querySelectorAll('.panel:first-child .cell');
      cells.forEach((cell) => {
        const x = (Math.random() - 0.5) * 1200;
        const y = (Math.random() - 0.5) * 800;
        const rot = (Math.random() - 0.5) * 180;
        cell.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        cell.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(0.3)`;
        cell.style.opacity = '0';
      });
      setTimeout(() => {
        window.location.href = 'all.html';
      }, 850);
    });
  </script>
